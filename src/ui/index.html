<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="/warden-logo.png" type="image/png" />
<title>Warden</title>
<style>
/*
 * Radix supplies the ramps as CSS variables (--blue-1 .. --blue-12, etc);
 * everything below is role-based so the chrome never hardcodes a colour.
 * Dark only for now: xterm themes are tuned for it and the tool lives in a
 * terminal, so there is no ambient light argument worth the extra surface.
 */
:root {
  --bg:        var(--gray-2);
  --surface:   var(--gray-3);
  --raised:    var(--gray-4);
  --line:      var(--gray-6);
  --line-soft: var(--gray-5);
  --fg:        var(--gray-12);
  --fg-muted:  var(--gray-11);
  --fg-subtle: var(--gray-9);
  --accent:    var(--blue-9);
  --accent-fg: var(--blue-11);
  --danger:    var(--red-9);
  --ok:        var(--green-9);

  --r-sm: 5px;
  --r-md: 7px;
  --r-lg: 10px;
  --pad: 10px;
}

:root[data-theme="dark"][data-scheme="tokyo-night"] { --bg:#1a1b26; --surface:#24283b; --raised:#292e42; --line:#3b4261; --line-soft:#2f354e; --fg:#c0caf5; --fg-muted:#a9b1d6; --fg-subtle:#565f89; --accent:#7aa2f7; --accent-fg:#b4d0ff; --danger:#f7768e; --ok:#9ece6a; }
:root[data-theme="dark"][data-scheme="catppuccin"] { --bg:#1e1e2e; --surface:#181825; --raised:#313244; --line:#45475a; --line-soft:#3a3c4e; --fg:#cdd6f4; --fg-muted:#bac2de; --fg-subtle:#6c7086; --accent:#89b4fa; --accent-fg:#b9d4ff; --danger:#f38ba8; --ok:#a6e3a1; }
:root[data-theme="dark"][data-scheme="dracula"] { --bg:#282a36; --surface:#21222c; --raised:#343746; --line:#6272a4; --line-soft:#44475a; --fg:#f8f8f2; --fg-muted:#d6d6d8; --fg-subtle:#8991b5; --accent:#bd93f9; --accent-fg:#d6bcfa; --danger:#ff5555; --ok:#50fa7b; }
:root[data-theme="dark"][data-scheme="nord"] { --bg:#2e3440; --surface:#3b4252; --raised:#434c5e; --line:#4c566a; --line-soft:#434c5e; --fg:#eceff4; --fg-muted:#d8dee9; --fg-subtle:#81a1c1; --accent:#88c0d0; --accent-fg:#aee4f0; --danger:#bf616a; --ok:#a3be8c; }
:root[data-theme="dark"][data-scheme="gruvbox"] { --bg:#282828; --surface:#1d2021; --raised:#3c3836; --line:#665c54; --line-soft:#504945; --fg:#ebdbb2; --fg-muted:#d5c4a1; --fg-subtle:#a89984; --accent:#fabd2f; --accent-fg:#ffe099; --danger:#fb4934; --ok:#b8bb26; }
:root[data-theme="dark"][data-scheme="one-dark"] { --bg:#282c34; --surface:#21252b; --raised:#353b45; --line:#4b5263; --line-soft:#3b4048; --fg:#abb2bf; --fg-muted:#9da5b4; --fg-subtle:#5c6370; --accent:#61afef; --accent-fg:#a9d8ff; --danger:#e06c75; --ok:#98c379; }
:root[data-theme="dark"][data-scheme="solarized"] { --bg:#002b36; --surface:#073642; --raised:#0b4653; --line:#1b5964; --line-soft:#0e414c; --fg:#fdf6e3; --fg-muted:#93a1a1; --fg-subtle:#586e75; --accent:#2aa198; --accent-fg:#7ed9d2; --danger:#dc322f; --ok:#859900; }
:root[data-theme="dark"][data-scheme="monokai"] { --bg:#272822; --surface:#1e1f1c; --raised:#3e3d32; --line:#54524a; --line-soft:#414038; --fg:#f8f8f2; --fg-muted:#cfcfc2; --fg-subtle:#75715e; --accent:#a6e22e; --accent-fg:#d5fa93; --danger:#f92672; --ok:#a6e22e; }
:root[data-theme="dark"][data-scheme="rose-pine"] { --bg:#191724; --surface:#1f1d2e; --raised:#26233a; --line:#403d52; --line-soft:#312e43; --fg:#e0def4; --fg-muted:#c4c0d9; --fg-subtle:#6e6a86; --accent:#c4a7e7; --accent-fg:#e2d4fc; --danger:#eb6f92; --ok:#9ccfd8; }
:root[data-theme="dark"][data-scheme="kanagawa"] { --bg:#1f1f28; --surface:#16161d; --raised:#2a2a37; --line:#54546d; --line-soft:#363646; --fg:#dcd7ba; --fg-muted:#c8c093; --fg-subtle:#727169; --accent:#7e9cd8; --accent-fg:#b2c7f5; --danger:#c34043; --ok:#98bb6c; }
:root[data-theme="dark"][data-scheme="everforest"] { --bg:#2d353b; --surface:#272e33; --raised:#3d484d; --line:#56635f; --line-soft:#465258; --fg:#d3c6aa; --fg-muted:#b9b99d; --fg-subtle:#859289; --accent:#a7c080; --accent-fg:#d1eab1; --danger:#e67e80; --ok:#a7c080; }
:root[data-theme="dark"][data-scheme="night-owl"] { --bg:#011627; --surface:#01111f; --raised:#0b2942; --line:#1d3b53; --line-soft:#0e2b42; --fg:#d6deeb; --fg-muted:#a9b8c9; --fg-subtle:#637777; --accent:#82aaff; --accent-fg:#b3c8ff; --danger:#ef5350; --ok:#addb67; }
:root[data-theme="dark"][data-scheme="ayu"] { --bg:#1f2430; --surface:#171b24; --raised:#2b3242; --line:#3f4a5e; --line-soft:#30394a; --fg:#cccac2; --fg-muted:#abb0b6; --fg-subtle:#707a8c; --accent:#ffcc66; --accent-fg:#ffe0a3; --danger:#ff6666; --ok:#bae67e; }
:root[data-theme="dark"][data-scheme="material"] { --bg:#263238; --surface:#1e272c; --raised:#37474f; --line:#4b626b; --line-soft:#35464d; --fg:#eeffff; --fg-muted:#b0bec5; --fg-subtle:#607d8b; --accent:#80cbc4; --accent-fg:#baf1ec; --danger:#ff5370; --ok:#c3e88d; }
:root[data-theme="dark"][data-scheme="cyberpunk"] { --bg:#170b24; --surface:#100718; --raised:#29133b; --line:#56296b; --line-soft:#3d1c53; --fg:#f7e9ff; --fg-muted:#d6b9e6; --fg-subtle:#9066a3; --accent:#f92aad; --accent-fg:#ff9bdb; --danger:#ff4f8b; --ok:#37ebf3; }
:root[data-theme="light"] { --bg:#f7f8fb; --surface:#ffffff; --raised:#eef1f7; --line:#d8dde8; --line-soft:#e6e9f0; --fg:#1e2636; --fg-muted:#475569; --fg-subtle:#7c879a; --accent:#2563eb; --accent-fg:#1d4ed8; --danger:#dc2626; --ok:#16a34a; }

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#root { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---- native window controls ----
 * Electron's hiddenInset title bar keeps macOS's traffic lights native. This
 * intentionally empty strip reserves the space they occupy so no workspace UI
 * sits behind close, minimise, and maximise. */
#windowbar {
  position: relative;
  height: 34px;
  flex: none;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  -webkit-app-region: drag;
}
#settings-button {
  position: absolute; top: 4px; right: 12px; width: 26px; height: 26px;
  display: grid; place-items: center; border: 0; border-radius: 6px;
  color: var(--fg-muted); background: transparent; cursor: pointer;
  -webkit-app-region: no-drag;
}
#settings-button:hover { background: var(--raised); color: var(--fg); }
#settings-button svg { width: 16px; height: 16px; stroke: currentColor; }
/* ---- layout ---- */
.spacer { flex: 1; }
main { flex: 1; display: grid; min-height: 0; }

/* The canvas owns the entire primary column; terminal chats mount only in the
 * detachable side panel, never behind the agent graph. */
.view { display: none; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
.view.on { display: flex; }

#rail {
  border-right: 1px solid var(--line);
  background: var(--surface);
  display: flex; flex-direction: column;
  min-height: 0;
}
#railgrip {
  cursor: col-resize;
  touch-action: none;
  position: relative;
  z-index: 2;
  background: var(--line);
}
#railgrip::after {
  content: "";
  position: absolute; inset: 0 -4px;
  background: transparent;
  transition: background .12s ease;
}
#railgrip:hover::after, #railgrip.drag::after { background: var(--accent); }
#railgrip:focus-visible { outline: 1px solid var(--accent); outline-offset: -1px; }
.rail-head {
  display: flex; align-items: center;
  padding: 10px 12px 8px;
  color: var(--fg-subtle);
  font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
}
.rail-head .count { margin-left: auto; }

#wslist { flex: 1; overflow: auto; padding: 0 6px; }
#wslist:empty::after {
  content: "no workspaces";
  display: block; color: var(--fg-subtle); font-size: 11px;
  padding: 24px 8px; text-align: center;
}

.ws {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px;
  border-radius: var(--r-sm);
  cursor: pointer;
  color: var(--fg-muted);
}
.ws:hover { background: var(--raised); color: var(--fg); }
.ws.sel { background: var(--raised); color: var(--fg); box-shadow: inset 2px 0 0 var(--accent); }
.ws .body { flex: 1; min-width: 0; }
.ws .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws .path {
  font-size: 10px; color: var(--fg-subtle);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  direction: rtl; text-align: left;
}
.ws .kill {
  border: 0; background: none; color: var(--fg-subtle);
  cursor: pointer; padding: 2px 4px; line-height: 1;
  border-radius: 3px; font-size: 13px; opacity: 0;
}
.ws:hover .kill { opacity: 1; }
.ws .kill svg { width: 13px; height: 13px; stroke: currentColor; }
.ws .kill:hover { background: var(--red-3); color: var(--red-11); }
/* A registry record whose directory is gone. It stays selectable-looking so the
   delete affordance is reachable, but it must not read as a working workspace. */
.ws.gone { opacity: .55; }
.ws.gone .name { text-decoration: line-through; text-decoration-color: var(--red-9); }
.ws.gone .path { color: var(--red-11); }
.ws.gone:hover { opacity: .85; }

#newws { display: flex; gap: 5px; padding: 8px; border-top: 1px solid var(--line); flex: none; }
#newws input {
  flex: 1; min-width: 0;
  background: var(--bg); border: 1px solid var(--line);
  color: var(--fg); padding: 6px 8px; border-radius: var(--r-sm);
  font: inherit; font-size: 11px; outline: none;
}
#newws input::placeholder { color: var(--fg-subtle); }
#newws input:focus { border-color: var(--accent); }

/* ---- primary agent workspace ---- */
#col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

#status {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 12px;
  border-top: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg-subtle); font-size: 10px;
  flex: none; min-height: 24px;
}
#status .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- buttons ---- */
button { font: inherit; }
.icon-btn {
  border: 1px solid var(--line); background: var(--raised); color: var(--fg-muted);
  width: 26px; height: 26px; border-radius: var(--r-sm);
  cursor: pointer; display: grid; place-items: center; font-size: 14px; line-height: 1;
  flex: none;
}
.icon-btn:hover { background: var(--gray-5); color: var(--fg); }
.icon-btn:disabled { opacity: .4; cursor: default; }
.icon-btn svg, #detail .x svg { width: 14px; height: 14px; stroke: currentColor; }

/* ---- settings ---- */
#settings-backdrop { position: fixed; inset: 0; z-index: 30; background: #0008; }
#settings-modal { position: fixed; z-index: 31; left: 50%; top: 50%; width: min(720px, calc(100% - 64px)); height: min(500px, calc(100% - 64px)); transform: translate(-50%, -50%); display: grid; grid-template-columns: 190px 1fr; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 28px 80px #0008; }
#settings-nav { padding: 20px 10px; border-right: 1px solid var(--line); background: var(--raised); }
.settings-nav-label, .settings-group-title { color: var(--fg-subtle); font-size: 10px; text-transform: uppercase; letter-spacing: .09em; }
.settings-nav-label { padding: 0 10px 12px; }
.settings-nav-item { width: 100%; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--fg-muted); text-align: left; cursor: default; font: inherit; font-size: 12px; }
.settings-nav-item.active { background: var(--surface); color: var(--fg); box-shadow: inset 2px 0 var(--accent); }
#settings-content { min-width: 0; overflow: auto; padding: 0 24px 28px; }
.settings-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0 18px; border-bottom: 1px solid var(--line-soft); }
.settings-header h1 { margin: 0; font-size: 16px; font-weight: 600; }
.settings-group { padding-top: 22px; }
.settings-group-title { margin-bottom: 10px; }
.theme-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.theme-option, .scheme-option { border: 1px solid var(--line); background: var(--bg); color: var(--fg-muted); cursor: pointer; font: inherit; }
.theme-option { min-height: 78px; padding: 10px; border-radius: 8px; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; font-size: 11px; }
.theme-option.selected, .scheme-option.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: var(--fg); }
.theme-preview { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 4px; background: #1a1b26; }
.theme-preview.light { background: #f7f8fb; }.theme-preview.system { background: linear-gradient(90deg, #f7f8fb 50%, #1a1b26 50%); }
.scheme-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.scheme-option { min-height: 42px; padding: 8px 10px; border-radius: 7px; display: flex; align-items: center; gap: 9px; text-align: left; font-size: 11px; }
.scheme-option i { width: 14px; height: 14px; flex: none; border-radius: 50%; background: var(--swatch); }.scheme-option b { margin-left: auto; color: var(--accent); font-size: 12px; }

/* toast: transient errors only; nothing here should be a permanent banner */
#toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--red-3); border: 1px solid var(--red-8); color: var(--red-11);
  padding: 8px 14px; border-radius: var(--r-md); font-size: 12px;
  max-width: 70vw; box-shadow: 0 6px 24px #0008;
  opacity: 0; pointer-events: none; transition: opacity .15s;
}
#toast.show { opacity: 1; }

/* ---- graph canvas ---- */
#graphwrap { flex: 1; min-height: 0; position: relative; background: var(--bg); }
#graph { display: block; width: 100%; height: 100%; }

#graphbar {
  position: absolute; top: 8px; left: 12px; right: 12px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
#graphbar .win { font-size: 10px; color: var(--fg-subtle); }
#graphbar .toggle {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; color: var(--fg-muted); cursor: pointer;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 3px 8px;
}
#graphbar .toggle:hover { border-color: var(--accent); }
#graphbar .toggle .ui-checkbox {
  width: 14px; height: 14px; margin: 0; padding: 0;
  display: grid; place-items: center; border: 1px solid var(--line);
  border-radius: 3px; background: var(--bg); color: var(--bg); cursor: pointer;
}
#graphbar .toggle .ui-checkbox[data-state="checked"] { background: var(--accent); border-color: var(--accent); }
#graphbar .toggle .ui-checkbox svg { width: 11px; height: 11px; stroke: currentColor; }
#graphbar .graph-controls { display: inline-flex; align-items: center; gap: 4px; }
#graphbar .graph-control {
  min-width: 24px; height: 24px; padding: 0 6px;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--surface); color: var(--fg-muted); cursor: pointer;
}
#graphbar .graph-control:hover:not(:disabled) { border-color: var(--accent); color: var(--fg); }
#graphbar .graph-control:disabled { opacity: .4; cursor: default; }
#graphbar .graph-control svg { width: 13px; height: 13px; stroke: currentColor; }
#graphbar .graph-control.center { padding: 0 8px; font-size: 10px; }
#graphbar .win-note { font-size: 10px; color: var(--fg-subtle); opacity: .75; }

#graphinfo {
  position: absolute; top: 36px; left: 12px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 10px; color: var(--fg-subtle); pointer-events: none;
}
#graphinfo .chip {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 2px 8px;
}
#graphinfo .warn { border-color: var(--amber-8); color: var(--amber-11); }
#graphhint { position: absolute; bottom: 10px; left: 12px; font-size: 10px; color: var(--fg-subtle); pointer-events: none; }

#detail {
  position: absolute; top: 0; right: 0; bottom: 0; width: 320px;
  background: var(--surface); border-left: 1px solid var(--line);
  padding: 12px 14px; overflow: auto;
  display: flex; flex-direction: column; gap: 10px;
}
#detail[hidden] { display: none; }
#detail h2 { margin: 0; font-size: 12px; line-height: 1.45; font-weight: 600; }
#detail .row { display: flex; flex-direction: column; gap: 2px; }
#detail .k { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-subtle); }
#detail .v { font-size: 11px; color: var(--fg-muted); word-break: break-all; }
#detail .x { position: absolute; top: 8px; right: 8px; border: 0; background: none; color: var(--fg-subtle); cursor: pointer; font-size: 15px; line-height: 1; }
#detail .x:hover { color: var(--fg); }
#detail .rel { font-size: 10px; color: var(--fg-subtle); }
#detail .rel b { color: var(--fg-muted); font-weight: 500; }

#gempty {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  color: var(--fg-subtle); text-align: center; padding: 0 24px;
}
#gempty[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* The agent list is a real sidebar, not a screen-reader accessory. It used to be
   a 1px clipped element that only became visible on :focus-visible, which meant
   it could not be pointed at — the canvas nodes were the only visible way in,
   and they are the read-only surface. */
#graphmain { flex: 1; display: flex; min-height: 0; min-width: 0; }
#agentlist {
  list-style: none; margin: 0; flex: none; width: 264px;
  overflow-y: auto; overflow-x: hidden;
  border-left: 1px solid var(--line); background: var(--surface);
  padding: 8px 8px 12px;
}
#agentlist:empty { display: none; }
#agentlist li { margin-bottom: 5px; }
#agentlist .empty { font-size: 10px; color: var(--fg-subtle); padding: 6px 4px; }
#agentlist button {
  font: inherit; text-align: left; width: 100%;
  display: flex; flex-direction: column; gap: 3px;
  color: var(--fg-muted); background: var(--raised);
  border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 7px 9px; cursor: pointer;
}
#agentlist button:hover { border-color: var(--accent); color: var(--fg); }
#agentlist button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#agentlist .name { font-size: 11px; color: var(--fg); line-height: 1.35; }
#agentlist .meta { font-size: 9px; color: var(--fg-subtle); font-variant-numeric: tabular-nums; }
#agentlist[hidden] { display: none; }
#agentlist .go { font-size: 9px; color: var(--accent); }

/* ---- docked side panel ----
   The agents view keeps its canvas on screen and puts the selected agent's shell
   in this column, in the slot the agent list occupies. Replacing the list rather
   than adding a third column is deliberate: the list is a launcher, and once a
   launcher has fired the only thing worth the width is the thing it launched. */
#sidepanel {
  flex: none; width: var(--side-w, 420px);
  min-width: 240px; max-width: 70%;
  display: flex; flex-direction: column; min-height: 0;
  border-left: 1px solid var(--line); background: var(--surface);
  position: relative;
}
#sidepanel[hidden] { display: none; }
#sidegrip {
  position: absolute; left: -3px; top: 0; bottom: 0; width: 7px;
  cursor: col-resize; z-index: 3; background: transparent;
}
#sidegrip.drag { background: var(--accent); opacity: .4; }
#sidegrip:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#sidehead {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px 7px 12px; flex: none;
  border-bottom: 1px solid var(--line); min-height: 30px;
  cursor: default;
}
#sidehead:hover { background: var(--raised); }
#sidehead:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#sidehead .t { font-size: 11px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#sidehead .m { font-size: 9px; color: var(--fg-subtle); font-variant-numeric: tabular-nums; white-space: nowrap; }
#sideterm { flex: 1; min-height: 0; padding: 6px 4px 4px; }
#sideterm .xterm { height: 100%; }
.terminal-host { height: 100%; min-height: 0; }
#subagent-activity { flex: 1; min-height: 0; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.activity-entry { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); padding: 8px; color: var(--fg-muted); font-size: 11px; white-space: pre-wrap; overflow-wrap: anywhere; }
.activity-entry.tool { color: var(--fg-subtle); }
.activity-tool { color: var(--accent); margin-right: 7px; }
