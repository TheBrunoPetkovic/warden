<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Warden</title>
<link rel="stylesheet" href="/vendor/xterm.css" />
<link rel="stylesheet" href="/vendor/radix/gray/dark.css" />
<link rel="stylesheet" href="/vendor/radix/blue/dark.css" />
<link rel="stylesheet" href="/vendor/radix/green/dark.css" />
<link rel="stylesheet" href="/vendor/radix/amber/dark.css" />
<link rel="stylesheet" href="/vendor/radix/red/dark.css" />
<link rel="stylesheet" href="/vendor/radix/cyan/dark.css" />
<link rel="stylesheet" href="/vendor/radix/iris/dark.css" />
<style>
/*
 * Radix supplies the ramps as CSS variables (--blue-1 .. --blue-12, etc);
 * everything below is role-based so the chrome never hardcodes a colour.
 * Dark only for now: xterm themes are tuned for it and the tool lives in a
 * terminal, so there is no ambient light argument worth the extra surface.
 */
:root {
  --bg:        var(--gray-2);
  --surface:   var(--gray-3);
  --raised:    var(--gray-4);
  --line:      var(--gray-6);
  --line-soft: var(--gray-5);
  --fg:        var(--gray-12);
  --fg-muted:  var(--gray-11);
  --fg-subtle: var(--gray-9);
  --accent:    var(--blue-9);
  --accent-fg: var(--blue-11);
  --danger:    var(--red-9);
  --ok:        var(--green-9);

  --r-sm: 5px;
  --r-md: 7px;
  --r-lg: 10px;
  --pad: 10px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---- top bar ---- */
header {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  flex: none;
}
header .mark { font-weight: 600; letter-spacing: .08em; font-size: 12px; }
.status { display: flex; align-items: center; gap: 6px; color: var(--fg-subtle); font-size: 11px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gray-8); }
.dot.live { background: var(--ok); }
.spacer { flex: 1; }
.hint { color: var(--fg-subtle); font-size: 11px; }

/* ---- layout ---- */
main { flex: 1; display: grid; grid-template-columns: 236px 1fr; min-height: 0; }

/*
 * Terminal and graph share the right-hand column. Only one is ever mounted, so
 * a stray xterm instance can't keep a websocket or a resize observer alive
 * behind the canvas.
 */
/*
 * flex: 1 is load-bearing, not decoration. Without it the active view is sized
 * by its content, so #screen collapses to whatever height xterm happened to fit
 * on mount and the rest of the column below it stays empty. The xterm ResizeObserver
 * cannot rescue that: it re-fits to the container, which is itself content-sized.
 */
.view { display: none; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
.view.on { display: flex; }

#rail {
  border-right: 1px solid var(--line);
  background: var(--surface);
  display: flex; flex-direction: column;
  min-height: 0;
}
.rail-head {
  display: flex; align-items: center;
  padding: 10px 12px 8px;
  color: var(--fg-subtle);
  font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
}
.rail-head .count { margin-left: auto; }

#wslist { flex: 1; overflow: auto; padding: 0 6px; }
#wslist:empty::after {
  content: "no workspaces";
  display: block; color: var(--fg-subtle); font-size: 11px;
  padding: 24px 8px; text-align: center;
}

.ws {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px;
  border-radius: var(--r-sm);
  cursor: pointer;
  color: var(--fg-muted);
}
.ws:hover { background: var(--raised); color: var(--fg); }
.ws.sel { background: var(--raised); color: var(--fg); box-shadow: inset 2px 0 0 var(--accent); }
.ws .body { flex: 1; min-width: 0; }
.ws .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws .path {
  font-size: 10px; color: var(--fg-subtle);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  direction: rtl; text-align: left;
}
.ws .kill {
  border: 0; background: none; color: var(--fg-subtle);
  cursor: pointer; padding: 2px 4px; line-height: 1;
  border-radius: 3px; font-size: 13px; opacity: 0;
}
.ws:hover .kill { opacity: 1; }
.ws .kill:hover { background: var(--red-3); color: var(--red-11); }
/* A registry record whose directory is gone. It stays selectable-looking so the
   delete affordance is reachable, but it must not read as a working workspace. */
.ws.gone { opacity: .55; }
.ws.gone .name { text-decoration: line-through; text-decoration-color: var(--red-9); }
.ws.gone .path { color: var(--red-11); }
.ws.gone:hover { opacity: .85; }

#newws { display: flex; gap: 5px; padding: 8px; border-top: 1px solid var(--line); flex: none; }
#newws input {
  flex: 1; min-width: 0;
  background: var(--bg); border: 1px solid var(--line);
  color: var(--fg); padding: 6px 8px; border-radius: var(--r-sm);
  font: inherit; font-size: 11px; outline: none;
}
#newws input::placeholder { color: var(--fg-subtle); }
#newws input:focus { border-color: var(--accent); }

/* ---- terminal column ---- */
#col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

#tabs {
  display: flex; align-items: stretch; gap: 1px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  flex: none; overflow-x: auto;
}
#tabs:empty { display: none; }
.tab {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 11px;
  background: var(--bg);
  border-right: 1px solid var(--line);
  color: var(--fg-subtle);
  cursor: pointer; white-space: nowrap;
  font-size: 11px;
}
.tab:hover { color: var(--fg-muted); background: var(--raised); }
.tab.sel { background: var(--bg); color: var(--fg); box-shadow: inset 0 2px 0 var(--accent); }
.tab .pip { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); flex: none; }
.tab.dead .pip { background: var(--danger); }
.tab .label { max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.tab .close { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 2px; opacity: .5; line-height: 1; }
.tab .close:hover { opacity: 1; color: var(--danger); }
.tab.add { padding: 7px 12px; background: var(--surface); }

#screen { flex: 1; min-height: 0; padding: 6px 4px 4px; }
#screen .xterm { height: 100%; }
#empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--fg-subtle); }
#empty code {
  background: var(--surface); border: 1px solid var(--line);
  padding: 2px 7px; border-radius: var(--r-sm); color: var(--fg-muted);
}

#status {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 12px;
  border-top: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg-subtle); font-size: 10px;
  flex: none; min-height: 24px;
}
#status .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- buttons ---- */
button { font: inherit; }
.icon-btn {
  border: 1px solid var(--line); background: var(--raised); color: var(--fg-muted);
  width: 26px; height: 26px; border-radius: var(--r-sm);
  cursor: pointer; display: grid; place-items: center; font-size: 14px; line-height: 1;
  flex: none;
}
.icon-btn:hover { background: var(--gray-5); color: var(--fg); }
.icon-btn:disabled { opacity: .4; cursor: default; }

/* toast: transient errors only; nothing here should be a permanent banner */
#toast {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--red-3); border: 1px solid var(--red-8); color: var(--red-11);
  padding: 8px 14px; border-radius: var(--r-md); font-size: 12px;
  max-width: 70vw; box-shadow: 0 6px 24px #0008;
  opacity: 0; pointer-events: none; transition: opacity .15s;
}
#toast.show { opacity: 1; }

/* ---- view switch ---- */
#viewswitch { display: flex; gap: 1px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
#viewswitch button {
  border: 0; background: var(--surface); color: var(--fg-subtle);
  padding: 6px 12px; font: inherit; font-size: 11px; cursor: pointer;
  border-bottom: 2px solid transparent;
}
#viewswitch button:hover { color: var(--fg-muted); }
#viewswitch button[aria-selected="true"] { color: var(--fg); background: var(--bg); border-bottom-color: var(--accent); }

/* ---- graph canvas ---- */
#graphwrap { flex: 1; min-height: 0; position: relative; background: var(--bg); }
#graph { display: block; width: 100%; height: 100%; }

#graphbar {
  position: absolute; top: 8px; left: 12px; right: 12px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
#graphbar .win { font-size: 10px; color: var(--fg-subtle); }
#graphbar .toggle {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; color: var(--fg-muted); cursor: pointer;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 3px 8px;
}
#graphbar .toggle:hover { border-color: var(--accent); }
#graphbar .toggle input { margin: 0; accent-color: var(--accent); }
#graphbar .win-note { font-size: 10px; color: var(--fg-subtle); opacity: .75; }

#graphinfo {
  position: absolute; top: 36px; left: 12px;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 10px; color: var(--fg-subtle); pointer-events: none;
}
#graphinfo .chip {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 2px 8px;
}
#graphinfo .warn { border-color: var(--amber-8); color: var(--amber-11); }
#graphhint { position: absolute; bottom: 10px; left: 12px; font-size: 10px; color: var(--fg-subtle); pointer-events: none; }

#detail {
  position: absolute; top: 0; right: 0; bottom: 0; width: 320px;
  background: var(--surface); border-left: 1px solid var(--line);
  padding: 12px 14px; overflow: auto;
  display: flex; flex-direction: column; gap: 10px;
}
#detail[hidden] { display: none; }
#detail h2 { margin: 0; font-size: 12px; line-height: 1.45; font-weight: 600; }
#detail .row { display: flex; flex-direction: column; gap: 2px; }
#detail .k { font-size: 9px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-subtle); }
#detail .v { font-size: 11px; color: var(--fg-muted); word-break: break-all; }
#detail .x { position: absolute; top: 8px; right: 8px; border: 0; background: none; color: var(--fg-subtle); cursor: pointer; font-size: 15px; line-height: 1; }
#detail .x:hover { color: var(--fg); }
#detail .rel { font-size: 10px; color: var(--fg-subtle); }
#detail .rel b { color: var(--fg-muted); font-weight: 500; }

#gempty {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  color: var(--fg-subtle); text-align: center; padding: 0 24px;
}
#gempty[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* The agent list is a real sidebar, not a screen-reader accessory. It used to be
   a 1px clipped element that only became visible on :focus-visible, which meant
   it could not be pointed at — the canvas nodes were the only visible way in,
   and they are the read-only surface. */
#graphmain { flex: 1; display: flex; min-height: 0; min-width: 0; }
#agentlist {
  list-style: none; margin: 0; flex: none; width: 264px;
  overflow-y: auto; overflow-x: hidden;
  border-left: 1px solid var(--line); background: var(--surface);
  padding: 8px 8px 12px;
}
#agentlist:empty { display: none; }
#agentlist li { margin-bottom: 5px; }
#agentlist .empty { font-size: 10px; color: var(--fg-subtle); padding: 6px 4px; }
#agentlist button {
  font: inherit; text-align: left; width: 100%;
  display: flex; flex-direction: column; gap: 3px;
  color: var(--fg-muted); background: var(--raised);
  border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 7px 9px; cursor: pointer;
}
#agentlist button:hover { border-color: var(--accent); color: var(--fg); }
#agentlist button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#agentlist .name { font-size: 11px; color: var(--fg); line-height: 1.35; }
#agentlist .meta { font-size: 9px; color: var(--fg-subtle); font-variant-numeric: tabular-nums; }
#agentlist[hidden] { display: none; }
#agentlist .go { font-size: 9px; color: var(--accent); }

/* ---- docked side panel ----
   The agents view keeps its canvas on screen and puts the selected agent's shell
   in this column, in the slot the agent list occupies. Replacing the list rather
   than adding a third column is deliberate: the list is a launcher, and once a
   launcher has fired the only thing worth the width is the thing it launched. */
#sidepanel {
  flex: none; width: var(--side-w, 420px);
  min-width: 240px; max-width: 70%;
  display: flex; flex-direction: column; min-height: 0;
  border-left: 1px solid var(--line); background: var(--surface);
  position: relative;
}
#sidepanel[hidden] { display: none; }
#sidegrip {
  position: absolute; left: -3px; top: 0; bottom: 0; width: 7px;
  cursor: col-resize; z-index: 3; background: transparent;
}
#sidegrip:hover, #sidegrip.drag { background: var(--accent); opacity: .4; }
#sidegrip:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#sidehead {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px 7px 12px; flex: none;
  border-bottom: 1px solid var(--line); min-height: 30px;
  cursor: default;
}
#sidehead:hover { background: var(--raised); }
#sidehead:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#sidehead .t { font-size: 11px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#sidehead .m { font-size: 9px; color: var(--fg-subtle); font-variant-numeric: tabular-nums; white-space: nowrap; }
#sideterm { flex: 1; min-height: 0; padding: 6px 4px 4px; }
#sideterm .xterm { height: 100%; }
</style>
</head>
<body>
<header>
  <span class="mark">WARDEN</span>
  <span class="status"><span class="dot" id="dot"></span><span id="conn">connecting</span></span>
  <span class="spacer"></span>
  <span class="hint" id="summary"></span>
</header>
<main>
  <nav id="rail">
    <div class="rail-head">Workspaces <span class="count" id="wscount"></span></div>
    <div id="wslist"></div>
    <form id="newws">
      <input id="wsname" placeholder="new workspace" autocomplete="off" spellcheck="false" aria-label="New workspace name" />
      <button class="icon-btn" type="submit" title="Create workspace" aria-label="Create workspace">+</button>
    </form>
  </nav>
  <section id="col">
    <div id="viewswitch" role="tablist" aria-label="View">
      <button id="vterm" role="tab" aria-selected="true">Terminals</button>
      <button id="vgraph" role="tab" aria-selected="false">Agents</button>
    </div>
    <div id="termview" class="view on">
      <div id="tabs" role="tablist" aria-label="Terminals"></div>
      <div id="screen"></div>
      <div id="status"><span class="path" id="statuspath"></span></div>
    </div>
    <div id="graphview" class="view">
      <div id="graphmain">
        <div id="graphwrap">
          <canvas id="graph" tabindex="0" role="application" aria-label="Running agents in this workspace"></canvas>
          <div id="graphbar">
            <label class="toggle">
              <input type="checkbox" id="subagents" />
              show subagent sessions
            </label>
            <span class="win-note">nodes are live processes, scoped to this workspace</span>
          </div>
          <div id="graphinfo"></div>
          <div id="gempty" hidden></div>
          <div id="graphhint">drag to pan, scroll to zoom &middot; click a node, or arrow keys + enter</div>
          <div id="detail" hidden>
            <button class="x" id="detailx" aria-label="Close details">&times;</button>
            <h2 id="d-title"></h2>
            <div class="row"><span class="k">runtime</span><span class="v" id="d-runtime"></span></div>
            <div class="row"><span class="k">directory</span><span class="v" id="d-dir"></span></div>
            <div class="row"><span class="k">session</span><span class="v" id="d-id"></span></div>
            <div class="row"><span class="k">started</span><span class="v" id="d-upd"></span></div>
            <div class="row"><span class="k">children</span><span class="v" id="d-kids"></span></div>
            <div class="rel" id="d-rel"></div>
          </div>
        </div>
        <!--
          The canvas shows the same agents but exposes nothing to a pointer or a
          keyboard, and clicking it must stay read-only. This list is the real
          control surface: selecting an agent docks the terminal it runs in.
        -->
        <ul id="agentlist" aria-label="Running agents"></ul>
        <!--
          Takes the agent list's slot while a terminal is docked. The xterm host
          is re-parented in here rather than a second xterm being built, so the
          shell keeps its scrollback and its socket across the move.
        -->
        <div id="sidepanel" hidden>
          <div id="sidegrip" role="separator" aria-orientation="vertical" tabindex="0"
               aria-label="Resize terminal panel" aria-valuemin="240" aria-valuenow="420"></div>
          <div id="sidehead" tabindex="-1" title="Click to move focus off the terminal &mdash; Escape then closes this panel">
            <span class="t" id="side-title"></span>
            <span class="m" id="side-meta"></span>
            <span class="spacer"></span>
            <button class="icon-btn" id="side-close" title="Close terminal panel" aria-label="Close terminal panel">&times;</button>
          </div>
          <div id="sideterm"></div>
        </div>
      </div>
      <div id="status"><span class="path" id="graphpath">select an agent to dock its terminal here</span></div>
    </div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
